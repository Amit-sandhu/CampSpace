<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampSpace — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>

<body class="mainpage-body">

  <!-- ================= TOP NAVIGATION ================= -->
  <header class="mainpage-nav">
    <div class="mainpage-nav-left">
      <div class="mainpage-logo">
        <svg class="mainpage-logo-mark" width="30" height="30" viewBox="0 0 30 30" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="15" r="15" fill="#2563EB" />
          <circle cx="11" cy="13" r="2.4" fill="#FAFAFB" />
          <circle cx="19" cy="13" r="2.4" fill="#FAFAFB" />
          <path d="M9 19c1.2 1.6 3.4 2.5 6 2.5s4.8-.9 6-2.5" stroke="#FAFAFB" stroke-width="1.8" stroke-linecap="round"
            fill="none" />
        </svg>
        <span class="mainpage-logo-text">CampSpace</span>
      </div>
      <button class="mainpage-kbd-hint" type="button" aria-hidden="true">⌘ K</button>
    </div>

    <div class="mainpage-nav-center">
      <button class="mainpage-search-trigger" id="mainpage-search-trigger" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span class="mainpage-search-placeholder">Search CampSpace...</span>
        <span class="mainpage-search-kbd">⌘ K</span>
      </button>
    </div>

    <div class="mainpage-nav-right">
      <button class="mainpage-btn mainpage-btn--ghost" id="mainpage-auto-arrange" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" />
        </svg>
        Auto-arrange
      </button>
      <button class="mainpage-btn mainpage-btn--primary" id="mainpage-new-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        New
      </button>
      <button class="mainpage-icon-btn" id="mainpage-theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" id="mainpage-theme-icon">
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="2" x2="12" y2="4" />
          <line x1="12" y1="20" x2="12" y2="22" />
          <line x1="4.93" y1="4.93" x2="6.34" y2="6.34" />
          <line x1="17.66" y1="17.66" x2="19.07" y2="19.07" />
          <line x1="2" y1="12" x2="4" y2="12" />
          <line x1="20" y1="12" x2="22" y2="12" />
          <line x1="4.93" y1="19.07" x2="6.34" y2="17.66" />
          <line x1="17.66" y1="6.34" x2="19.07" y2="4.93" />
        </svg>
      </button>
      <button class="mainpage-icon-btn" id="mainpage-notif-btn" type="button" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="mainpage-notif-dot"></span>
      </button>
      <div class="mainpage-account" id="mainpage-account">
        <button class="mainpage-avatar" id="mainpage-avatar-btn" type="button" aria-label="Profile" aria-haspopup="true"
          aria-expanded="false">AR</button>
        <div class="mainpage-account-menu" id="mainpage-account-menu" role="menu">
          <div class="mainpage-account-menu-header">
            <span class="mainpage-account-menu-name" id="mainpage-account-name">—</span>
            <span class="mainpage-account-menu-email" id="mainpage-account-email">—</span>
          </div>
          <button class="mainpage-account-menu-item" id="mainpage-logout-btn" type="button" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Log out
          </button>
          <a class="mainpage-account-menu-item" id="mainpage-signin-link" href="login.html" role="menuitem"
            style="display:none; text-decoration:none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Sign in
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= WORKSPACE CANVAS ================= -->
  <main class="mainpage-canvas-viewport">
    <div class="mainpage-canvas" id="mainpage-canvas">

      <!-- DASHBOARD WINDOW (empty) -->
      <section class="mainpage-window mainpage-window--dashboard" data-mainpage-window data-app="dashboard"
        style="--mainpage-x:120px; --mainpage-y:100px; --mainpage-w:460px;">
        <header class="mainpage-window-bar" data-mainpage-drag-handle>
          <div class="mainpage-traffic-lights">
            <button class="mainpage-tl mainpage-tl--red" data-mainpage-action="close" aria-label="Close"></button>
            <button class="mainpage-tl mainpage-tl--yellow" data-mainpage-action="minimize"
              aria-label="Minimize"></button>
            <button class="mainpage-tl mainpage-tl--green" data-mainpage-action="maximize"
              aria-label="Maximize"></button>
          </div>
          <h2 class="mainpage-window-title">Dashboard</h2>
        </header>
        <div class="mainpage-window-body mainpage-empty-body">
          <div class="mainpage-empty-state">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <p>Nothing here yet</p>
            <span>Open Calendar, Notepad, or Calculator from the dock below</span>
          </div>
        </div>
      </section>

      <!-- CALENDAR WINDOW -->
      <section class="mainpage-window mainpage-window--calendar mainpage-window--hidden" data-mainpage-window
        data-app="calendar" style="--mainpage-x:600px; --mainpage-y:90px; --mainpage-w:360px;">
        <header class="mainpage-window-bar" data-mainpage-drag-handle>
          <div class="mainpage-traffic-lights">
            <button class="mainpage-tl mainpage-tl--red" data-mainpage-action="close" aria-label="Close"></button>
            <button class="mainpage-tl mainpage-tl--yellow" data-mainpage-action="minimize"
              aria-label="Minimize"></button>
            <button class="mainpage-tl mainpage-tl--green" data-mainpage-action="maximize"
              aria-label="Maximize"></button>
          </div>
          <h2 class="mainpage-window-title">Calendar</h2>
        </header>
        <div class="mainpage-window-body mainpage-calendar-body">
          <div class="mainpage-calendar-toolbar">
            <button class="mainpage-cal-nav" id="mainpage-cal-prev" aria-label="Previous month">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <span class="mainpage-calendar-month" id="mainpage-cal-label">Month Year</span>
            <button class="mainpage-cal-nav" id="mainpage-cal-next" aria-label="Next month">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
            <button class="mainpage-window-action" id="mainpage-cal-today">Today</button>
          </div>
          <div class="mainpage-month-weekdays">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="mainpage-month-grid" id="mainpage-cal-grid"></div>
          <div class="mainpage-cal-selected" id="mainpage-cal-selected">Pick a date</div>
        </div>
      </section>

      <!-- NOTEPAD WINDOW -->
      <section class="mainpage-window mainpage-window--notepad mainpage-window--hidden" data-mainpage-window
        data-app="notepad" style="--mainpage-x:1010px; --mainpage-y:100px; --mainpage-w:380px;">
        <header class="mainpage-window-bar" data-mainpage-drag-handle>
          <div class="mainpage-traffic-lights">
            <button class="mainpage-tl mainpage-tl--red" data-mainpage-action="close" aria-label="Close"></button>
            <button class="mainpage-tl mainpage-tl--yellow" data-mainpage-action="minimize"
              aria-label="Minimize"></button>
            <button class="mainpage-tl mainpage-tl--green" data-mainpage-action="maximize"
              aria-label="Maximize"></button>
          </div>
          <h2 class="mainpage-window-title">Notepad</h2>
          <button class="mainpage-window-action mainpage-window-action--icon" id="mainpage-notepad-clear">Clear</button>
        </header>
        <div class="mainpage-window-body mainpage-notepad-body">
          <textarea class="mainpage-notepad-textarea" id="mainpage-notepad-textarea" placeholder="Start typing..."
            spellcheck="false"></textarea>
          <div class="mainpage-notepad-footer">
            <span id="mainpage-notepad-count">0 words · 0 characters</span>
            <span id="mainpage-notepad-status">Saved for this session</span>
          </div>
        </div>
      </section>

      <!-- CALCULATOR WINDOW -->
      <section class="mainpage-window mainpage-window--calculator mainpage-window--hidden" data-mainpage-window
        data-app="calculator" style="--mainpage-x:600px; --mainpage-y:430px; --mainpage-w:280px;">
        <header class="mainpage-window-bar" data-mainpage-drag-handle>
          <div class="mainpage-traffic-lights">
            <button class="mainpage-tl mainpage-tl--red" data-mainpage-action="close" aria-label="Close"></button>
            <button class="mainpage-tl mainpage-tl--yellow" data-mainpage-action="minimize"
              aria-label="Minimize"></button>
            <button class="mainpage-tl mainpage-tl--green" data-mainpage-action="maximize"
              aria-label="Maximize"></button>
          </div>
          <h2 class="mainpage-window-title">Calculator</h2>
        </header>
        <div class="mainpage-window-body mainpage-calculator-body">
          <div class="mainpage-calc-display">
            <div class="mainpage-calc-expression" id="mainpage-calc-expr">&nbsp;</div>
            <div class="mainpage-calc-result" id="mainpage-calc-result">0</div>
          </div>
          <div class="mainpage-calc-grid">
            <button class="mainpage-calc-btn mainpage-calc-btn--fn" data-calc-action="clear">C</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--fn" data-calc-action="backspace">⌫</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--fn" data-calc-action="percent">%</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--op" data-calc-op="÷">÷</button>

            <button class="mainpage-calc-btn" data-calc-num="7">7</button>
            <button class="mainpage-calc-btn" data-calc-num="8">8</button>
            <button class="mainpage-calc-btn" data-calc-num="9">9</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--op" data-calc-op="×">×</button>

            <button class="mainpage-calc-btn" data-calc-num="4">4</button>
            <button class="mainpage-calc-btn" data-calc-num="5">5</button>
            <button class="mainpage-calc-btn" data-calc-num="6">6</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--op" data-calc-op="−">−</button>

            <button class="mainpage-calc-btn" data-calc-num="1">1</button>
            <button class="mainpage-calc-btn" data-calc-num="2">2</button>
            <button class="mainpage-calc-btn" data-calc-num="3">3</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--op" data-calc-op="+">+</button>

            <button class="mainpage-calc-btn mainpage-calc-btn--wide" data-calc-num="0">0</button>
            <button class="mainpage-calc-btn" data-calc-action="decimal">.</button>
            <button class="mainpage-calc-btn mainpage-calc-btn--equals" data-calc-action="equals">=</button>
          </div>
        </div>
      </section>

      <!-- CODE EDITOR WINDOW -->
      <section class="mainpage-window mainpage-window--code mainpage-window--hidden" data-mainpage-window
        data-app="code" style="--mainpage-x:120px; --mainpage-y:480px; --mainpage-w:640px;">
        <header class="mainpage-window-bar" data-mainpage-drag-handle>
          <div class="mainpage-traffic-lights">
            <button class="mainpage-tl mainpage-tl--red" data-mainpage-action="close" aria-label="Close"></button>
            <button class="mainpage-tl mainpage-tl--yellow" data-mainpage-action="minimize"
              aria-label="Minimize"></button>
            <button class="mainpage-tl mainpage-tl--green" data-mainpage-action="maximize"
              aria-label="Maximize"></button>
          </div>
          <h2 class="mainpage-window-title">Code Editor</h2>
          <button class="mainpage-window-action mainpage-window-action--icon" id="mainpage-code-run">▶ Run</button>
        </header>
        <div class="mainpage-window-body mainpage-code-body">
          <!-- Monaco (the VS Code editor) will be created inside this empty div -->
          <div class="mainpage-code-editor" id="mainpage-code-editor"></div>

          <!-- A simple, simulated terminal panel underneath the editor -->
          <div class="mainpage-code-terminal">
            <div class="mainpage-code-terminal-output" id="mainpage-code-terminal-output"></div>
            <div class="mainpage-code-terminal-inputrow">
              <span class="mainpage-code-terminal-prompt">&gt;</span>
              <input type="text" class="mainpage-code-terminal-input" id="mainpage-code-terminal-input"
                placeholder="Type a command (try 'help') and press Enter" autocomplete="off" spellcheck="false">
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ================= DOCK ================= -->
  <nav class="mainpage-dock" aria-label="Application dock">
    <button class="mainpage-dock-item mainpage-dock-item--active" data-mainpage-dock-app="dashboard"
      data-mainpage-tip="Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </svg>
    </button>
    <button class="mainpage-dock-item" data-mainpage-dock-app="calendar" data-mainpage-tip="Calendar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
    </button>
    <button class="mainpage-dock-item" data-mainpage-dock-app="notepad" data-mainpage-tip="Notepad">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="8" y1="13" x2="16" y2="13" />
        <line x1="8" y1="17" x2="13" y2="17" />
      </svg>
    </button>
    <button class="mainpage-dock-item" data-mainpage-dock-app="calculator" data-mainpage-tip="Calculator">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2" />
        <line x1="8" y1="6" x2="16" y2="6" />
        <line x1="8" y1="11" x2="8" y2="11.01" />
        <line x1="12" y1="11" x2="12" y2="11.01" />
        <line x1="16" y1="11" x2="16" y2="11.01" />
        <line x1="8" y1="15" x2="8" y2="15.01" />
        <line x1="12" y1="15" x2="12" y2="15.01" />
        <line x1="16" y1="15" x2="16" y2="15.01" />
        <line x1="8" y1="19" x2="8" y2="19.01" />
        <line x1="12" y1="19" x2="12" y2="19.01" />
        <line x1="16" y1="19" x2="16" y2="19.01" />
      </svg>
    </button>
    <button class="mainpage-dock-item" data-mainpage-dock-app="code" data-mainpage-tip="Code Editor">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6" />
        <polyline points="8 6 2 12 8 18" />
      </svg>
    </button>
  </nav>


  <!-- ================= SEARCH PALETTE (⌘K) ================= -->
  <div class="mainpage-palette-overlay" id="mainpage-palette-overlay">
    <div class="mainpage-palette" role="dialog" aria-modal="true" aria-label="Search CampSpace">
      <div class="mainpage-palette-input-row">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="mainpage-palette-input" placeholder="Search apps or commands..." autocomplete="off">
        <span class="mainpage-palette-esc">ESC</span>
      </div>
      <div class="mainpage-palette-results" id="mainpage-palette-results">
        <span class="mainpage-palette-group-label">Apps</span>
        <button class="mainpage-palette-row" data-mainpage-palette-app="dashboard"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>Dashboard</button>
        <button class="mainpage-palette-row" data-mainpage-palette-app="calendar"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>Calendar</button>
        <button class="mainpage-palette-row" data-mainpage-palette-app="notepad"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>Notepad</button>
        <button class="mainpage-palette-row" data-mainpage-palette-app="calculator"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <line x1="8" y1="6" x2="16" y2="6" />
          </svg>Calculator</button>
        <button class="mainpage-palette-row" data-mainpage-palette-app="code"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>Code Editor</button>
        <span class="mainpage-palette-group-label">Commands</span>
        <button class="mainpage-palette-row" data-mainpage-palette-command="auto-arrange"><svg width="14" height="14"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" />
          </svg>Auto-arrange windows</button>
      </div>
    </div>
  </div>

  <!-- Monaco Editor (the same code editor VS Code uses), loaded from a CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>

  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>

</html>
